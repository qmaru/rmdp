[package]
name = "rmdp"
version = "0.7.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
select = "0.6.1"
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }


[profile.release]
lto = true
opt-level = 'z'
panic = 'abort'
strip = true
